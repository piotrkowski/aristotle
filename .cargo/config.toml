# Device builds: static, hard-float musl. Runs on the softfp stock userspace
# because nothing is linked dynamically.
#
# The build directory is set by the scripts in tools/ through CARGO_TARGET_DIR
# ($ARISTOTLE_CACHE/target, see tools/env.sh); Cargo cannot expand variables
# here.
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# Host build of aristotle-render for preview PNGs: static x86_64 musl, linked
# the same way against the C libraries tools/build-plato.sh builds for the PC.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
# Non-PIE: Rust defaults to static-pie on x86_64 musl, but the C archives are
# built without -fPIC (as on the device, where static executables are not PIE).
rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static"]
