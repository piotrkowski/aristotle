[package]
name = "aristotle-observe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Observes any UI on the device (stock or ours): pairs touches with the EPDC updates they cause, injects scripted touches, and benchmarks the EPDC"

[dependencies]
aristotle-hal = { path = "../aristotle-hal" }
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
