[package]
name = "aristotle-library"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Book library for Aristotle: finds, indexes and describes DRM-free EPUB, MOBI/AZW3, PDF, TXT and CBZ files"

# Pure Rust on purpose: the crate must build statically for
# armv7-unknown-linux-musleabihf without a C toolchain, and stay small.
[dependencies]
aristotle-i18n = { path = "../aristotle-i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
miniz_oxide = "0.8"
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.18"
md-5 = "0.11"

[[bin]]
name = "aristotle-library-cli"
path = "src/bin/cli.rs"
