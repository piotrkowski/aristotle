[package]
name = "aristotle-render"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "E-book page renderer for Aristotle on the PW4, built on Plato's document engine"

# Not a default member of the workspace: plato-core links static C libraries
# (tools/build-plato.sh), which a fresh checkout does not have. Build with
# tools/build-render.sh; see README.md and docs/reader.md.

[dependencies]
aristotle-hal = { path = "../aristotle-hal" }
libc = "0.2"
# Same version as plato-core, to decode spine hrefs exactly as it does.
percent-encoding = "2.3.2"
# Our Plato fork (third_party/plato, branch aristotle); docs/reader.md.
plato-core = { path = "../../third_party/plato/crates/core" }
# Same version as plato-core uses, to read EPUB metadata it does not expose
# and to write converted MOBI books (stored). Deflate only, as in plato-core
# (the fork's "core: zip deflate only"): EPUBs use no other codec.
zip = { version = "7.0.0", default-features = false, features = ["deflate-flate2"] }
