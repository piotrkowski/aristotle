[package]
name = "aristotle-reader"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Aristotle's reader app for the PW4: library, Plato-rendered pages, menu, progress"
# Member of the aristotle-render workspace, which links Plato's C libraries;
# the root workspace excludes both. Build with tools/build-render.sh.
workspace = "../aristotle-render"

[[bin]]
name = "aristotle"
path = "src/main.rs"

[dependencies]
aristotle-hal = { path = "../aristotle-hal" }
aristotle-library = { path = "../aristotle-library" }
aristotle-render = { path = "../aristotle-render" }
# The UI font is compiled in; the preview binary and its PNG encoder are not.
aristotle-ui = { path = "../aristotle-ui", default-features = false, features = ["embedded-fonts"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Page snapshots (src/snapshot.rs). Same version and features as zip's, so
# it adds no new C build.
zstd = { version = "0.13", default-features = false }
# Same versions as plato-core: dictzip chunks and Unicode folding for the
# dictionary.
flate2 = "1.1.5"
unicode-normalization = "0.1.25"

[dev-dependencies]
# Same version as plato-core; the export test runs the owner's parser regexes.
regex = "1.12.2"
