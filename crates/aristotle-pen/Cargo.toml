[package]
name = "aristotle-pen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Finger and pen stroke rendering with pipelined e-ink updates, plus record/replay tools to tune it"

[dependencies]
aristotle-hal = { path = "../aristotle-hal" }

[[bin]]
name = "aristotle-pen-live"
path = "src/bin/live.rs"

[[bin]]
name = "aristotle-pen-bench"
path = "src/bin/bench.rs"
