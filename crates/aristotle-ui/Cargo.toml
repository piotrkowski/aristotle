[package]
name = "aristotle-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Retained UI toolkit for e-ink: grayscale canvas, shaped text, widgets, damage with waveform hints, gestures"

[features]
default = ["embedded-fonts", "preview"]
# Compile Literata (four styles, about 1.3 MB) into the binary so the UI
# always has a font, even before the userstore is mounted.
embedded-fonts = []
# The desktop preview binary; pulls in the PNG encoder.
preview = ["dep:png"]

[dependencies]
aristotle-i18n = { path = "../aristotle-i18n" }
swash = { version = "0.2", default-features = false, features = ["std", "scale", "render"] }
zeno = { version = "0.3", default-features = false, features = ["std", "eval"] }
unicode-linebreak = "0.1"
png = { version = "0.18", optional = true }

[[bin]]
name = "aristotle-ui-preview"
path = "src/bin/preview.rs"
required-features = ["preview"]
