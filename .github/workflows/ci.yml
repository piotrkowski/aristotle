name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# check and device: the workspace's default members, the pure-Rust crates,
# which build and test on any host. Cargo still reads plato-core's manifest
# from the submodule, hence the recursive checkout. `cargo fmt` without --all
# checks every member, the native ones included, but not Plato's crates.
#
# native and bundle: the two members that link Plato (crates/aristotle-render
# and the reader app), with the C libraries from tools/build-plato.sh
# (.github/actions/plato-libs). Building those takes a few minutes per target
# (1.5 on a fast 2-core PC, about 6 on a slow one); they are cached per Plato
# commit and build script, so later runs restore them in about a minute.
# With the libraries cached, native and bundle should take 5 to 10 minutes
# each, most of it the release-profile Rust build.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - name: Shell scripts parse
        run: |
          git ls-files -z '*.sh' | xargs -0 -n1 sh -n
          sh -n device/extension/agent/aristotlectl
      - name: Device agent tests (host-side, stubbed)
        run: sh device/tests/net.sh && sh device/tests/agent.sh

  # The default members for the device: static armv7 musl, linked by rust-lld
  # with Rust's own musl (.cargo/config.toml), so no C cross toolchain is
  # needed. The native members need Plato's C libraries and are left out, as
  # in the check job.
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup target add armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: armv7-unknown-linux-musleabihf
      - run: cargo build --release --locked --target armv7-unknown-linux-musleabihf
      - name: Binaries are static
        run: |
          for f in $(find target/armv7-unknown-linux-musleabihf/release -maxdepth 1 -type f -executable); do
              if readelf -lW "$f" | grep -q INTERP; then
                  echo "$f has a program interpreter (not static)" >&2
                  exit 1
              fi
          done

  # The native members on the host (x86_64 musl), as CONTRIBUTING.md runs
  # them: clippy with -D warnings, then the tests.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_FLAGS: --locked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup target add x86_64-unknown-linux-musl && rustup component add clippy
      - uses: ./.github/actions/plato-libs
        with:
          target: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-x86_64-unknown-linux-musl
      - run: tools/build-render.sh host
        env:
          CARGO_CMD: clippy
      - run: tools/build-render.sh host
        env:
          CARGO_CMD: test

  # The reader app for the device, packaged as the release zip
  # (tools/package.sh), kept as a workflow artifact for 14 days.
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_FLAGS: --locked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup target add armv7-unknown-linux-musleabihf
      - uses: ./.github/actions/plato-libs
        with:
          target: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-armv7-unknown-linux-musleabihf
      - run: tools/build-render.sh device
      - name: Binaries are static
        run: |
          for f in "$ARISTOTLE_CACHE"/render/device/aristotle "$ARISTOTLE_CACHE"/render/device/aristotle-render; do
              if readelf -lW "$f" | grep -q INTERP; then
                  echo "$f has a program interpreter (not static)" >&2
                  exit 1
              fi
          done
      - name: Package
        run: |
          tools/package.sh zip "dist/aristotle-$(tools/package.sh version)-${GITHUB_SHA::7}.zip"
          unzip -l dist/*.zip | tail -n 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.zip
          archive: false
          retention-days: 14
          if-no-files-found: error

  # deny.toml: licences, bans and sources of every crate in Cargo.lock, and the
  # RustSec advisories. A new advisory can appear without any change here, so
  # that check is reported but does not fail the run.
  deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
