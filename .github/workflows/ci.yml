name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The workspace's default members: the pure-Rust crates, which build and test
# on any host. The two members that link Plato (crates/aristotle-render and the
# reader app) need the C libraries from tools/build-plato.sh and are checked
# locally; see .github/CONTRIBUTING.md. Cargo still reads plato-core's manifest
# from the submodule, hence the recursive checkout. `cargo fmt` without --all
# checks every member, the native ones included, but not Plato's crates.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - name: Shell scripts parse
        run: git ls-files -z '*.sh' | xargs -0 -n1 sh -n
      - name: Device agent tests (host-side, stubbed)
        run: sh device/tests/net.sh && sh device/tests/agent.sh

  # The default members for the device: static armv7 musl, linked by rust-lld
  # with Rust's own musl (.cargo/config.toml), so no C cross toolchain is
  # needed. The native members need Plato's C libraries and are left out, as
  # in the check job.
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup target add armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: armv7-unknown-linux-musleabihf
      - run: cargo build --release --locked --target armv7-unknown-linux-musleabihf
      - name: Binaries are static
        run: |
          for f in $(find target/armv7-unknown-linux-musleabihf/release -maxdepth 1 -type f -executable); do
              if readelf -lW "$f" | grep -q INTERP; then
                  echo "$f has a program interpreter (not static)" >&2
                  exit 1
              fi
          done

  # deny.toml: licences, bans and sources of every crate in Cargo.lock, and the
  # RustSec advisories. A new advisory can appear without any change here, so
  # that check is reported but does not fail the run.
  deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
