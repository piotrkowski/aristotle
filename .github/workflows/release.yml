name: Release

# A tag vX.Y.Z (matching workspace.package.version in Cargo.toml) builds the
# release from source, without caches, and creates a draft GitHub release:
#
#   aristotle-X.Y.Z.zip               unpacks to the root of the Kindle's USB
#                                     drive: aristotle/ and extensions/aristotle/
#                                     (tools/package.sh zip)
#   aristotle-X.Y.Z-source.tar.gz     the corresponding source: Aristotle and
#                                     Plato at the tagged commits, with the C
#                                     library URLs and hashes (tools/package.sh
#                                     source)
#   SHA256SUMS
#
# The notes are the tag's section of CHANGELOG.md. The files get build
# provenance attestations (gh attestation verify FILE --repo OWNER/aristotle),
# which GitHub issues for public repositories. Publishing the draft is
# manual. The C libraries and the release build take about 35 minutes on a
# 2-core runner.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # the attestations' signing certificate
      attestations: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_FLAGS: --locked
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: The tag matches the version
        run: |
          version=$(tools/package.sh version)
          if [ "$TAG" != "v$version" ]; then
              echo "::error::tag $TAG, but Cargo.toml has version $version"
              exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          mkdir -p out/assets
          awk -v head="## [$VERSION]" '
              /^## \[/ { if (on) exit; on = index($0, head) == 1; next }
              /^\[[^]]*\]: / { exit }
              on
          ' CHANGELOG.md > out/notes.md
          if ! grep -q '[^[:space:]]' out/notes.md; then
              echo "::error::CHANGELOG.md has no section for $VERSION"
              exit 1
          fi
      - run: rustup target add armv7-unknown-linux-musleabihf
      - uses: ./.github/actions/plato-libs
        with:
          target: armv7-unknown-linux-musleabihf
          cache: "false"
      - run: tools/build-render.sh device
      - name: Binaries are static
        run: |
          for f in "$ARISTOTLE_CACHE"/render/device/aristotle "$ARISTOTLE_CACHE"/render/device/aristotle-render; do
              if readelf -lW "$f" | grep -q INTERP; then
                  echo "$f has a program interpreter (not static)" >&2
                  exit 1
              fi
          done
      - name: Package
        run: |
          tools/package.sh zip "out/assets/aristotle-$VERSION.zip"
          tools/package.sh source "out/assets/aristotle-$VERSION-source.tar.gz"
          cd out/assets
          sha256sum aristotle-* >> SHA256SUMS
          cat SHA256SUMS
          unzip -p "aristotle-$VERSION.zip" aristotle/SOURCE.txt | grep -F "tag $TAG"
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/assets/SHA256SUMS
      - if: github.event.repository.visibility != 'public'
        run: echo "::warning::no attestations; GitHub issues them for public repositories only"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/assets/* --repo "$GITHUB_REPOSITORY" --draft \
              --verify-tag --title "Aristotle ${TAG#v}" --notes-file out/notes.md
