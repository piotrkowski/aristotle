# Screenshot manifest for compose.py.
#
# Inputs are raw 1072x1448 8-bit gray captures of the device's framebuffer
# (tools/host/screenshot.sh), in English, of public-domain books: Aristotle's
# Nicomachean Ethics, Book I, in Bywater's Greek and Chase's translation
# (Project Gutenberg #8438), with a Wiktionary dictionary (CC BY-SA). Relative
# input paths resolve against `base`; set SCREENSHOTS_BASE to override it.
# Paths may use ~ and $VARS. `out_dir` is relative to this file; an output may
# set its own.

base = "$ARISTOTLE_CACHE/captures/readme"
out_dir = "../../docs/images"

# Frame styles; an output picks one with `style`, which overrides `default`.
#   radius     corner radius in output pixels
#   bezel_px   width of a dark bezel around the page (0: the page is the card)
#   border     1 px hairline just outside the edge, "#rrggbb/alpha"
#   shadows    [y offset px, blur px, opacity] layers, all black
#   padding    transparent margin around everything; gap between screens
[style.default]
radius = 18
bezel_px = 0
border = "#000000/22"
shadows = [[1, 2, 0.05], [14, 28, 0.13]]
padding = 56
gap = 56

# Night-mode screens, for GitHub's dark theme: a lighter hairline and a
# stronger shadow, as on a dark page.
[style.night]
border = "#ffffff/26"
shadows = [[1, 2, 0.30], [16, 30, 0.55]]

# The same with a thin dark bezel instead of a bare page.
[style.bezel]
radius = 28
bezel_px = 16
bezel_color = "#1c1c1c"

[style.bezel-night]
radius = 28
bezel_px = 16
bezel_color = "#262626"
border = "#ffffff/26"
shadows = [[1, 2, 0.30], [16, 30, 0.55]]

# The site's figures: a narrower margin, so the card fills its column.
[style.site]
padding = 32
shadows = [[1, 2, 0.05], [8, 16, 0.13]]

[style.site-night]
padding = 32
border = "#ffffff/26"
shadows = [[1, 2, 0.30], [8, 16, 0.45]]

# README: library, English page, Greek dictionary popup. 536 px is half the
# panel width, so the README shows the panel's pixels at 2x density.
[[output]]
name = "readme-light.png"
screen_width = 536
inputs = ["day-library.png", "day-english-page.png", "day-greek-popup.png"]

[[output]]
name = "readme-dark.png"
style = "night"
screen_width = 536
inputs = ["night-library.png", "night-english-page.png", "night-greek-popup.png"]

# Single shots for the docs, at the same 2x density.
[[output]]
name = "library.png"
screen_width = 536
inputs = ["day-library.png"]

[[output]]
name = "reader.png"
screen_width = 536
inputs = ["day-english-page.png"]

[[output]]
name = "dictionary.png"
screen_width = 536
inputs = ["day-greek-popup.png"]

[[output]]
name = "reader-menu.png"
screen_width = 536
inputs = ["day-menu.png"]

[[output]]
name = "settings.png"
screen_width = 536
inputs = ["day-settings.png"]

[[output]]
name = "reader-night.png"
style = "night"
screen_width = 536
inputs = ["night-english-page.png"]

