# Screenshot manifest for compose.py.
#
# Inputs are raw 1072x1448 8-bit gray panel captures. Relative input paths
# resolve against `base`; set SCREENSHOTS_BASE to override it, e.g. to point at
# device captures. Paths may use ~ and $VARS. `out_dir` is relative to this file.

base = "~/.cache/aristotle/ui-preview"
out_dir = "../../assets/screenshots"

# Frame styles; an output picks one with `style`, which overrides `default`.
#   radius     corner radius in output pixels
#   bezel_px   width of a dark bezel around the page (0: the page is the card)
#   border     1 px hairline just outside the edge, "#rrggbb/alpha"
#   shadows    [y offset px, blur px, opacity] layers, all black
#   padding    transparent margin around everything; gap between screens
[style.default]
radius = 18
bezel_px = 0
border = "#000000/22"
shadows = [[1, 2, 0.05], [14, 28, 0.13]]
padding = 56
gap = 56

# Night-mode screens, for GitHub's dark theme: a lighter hairline and a
# stronger shadow, as on a dark page.
[style.night]
border = "#ffffff/26"
shadows = [[1, 2, 0.30], [16, 30, 0.55]]

# The same with a thin dark bezel instead of a bare page.
[style.bezel]
radius = 28
bezel_px = 16
bezel_color = "#1c1c1c"

[style.bezel-night]
radius = 28
bezel_px = 16
bezel_color = "#262626"
border = "#ffffff/26"
shadows = [[1, 2, 0.30], [16, 30, 0.55]]

# README: library, book page, dictionary. 536 px is half the panel width,
# so the README shows the panel's pixels at 2x density.
[[output]]
name = "readme-light.png"
screen_width = 536
inputs = ["docs-v1/library-cards.png", "docs-v1/reader.png", "reading/04-dict-polish.png"]

[[output]]
name = "readme-dark.png"
style = "night"
screen_width = 536
inputs = ["docs-v1/library-cards-night.png", "docs-v1/reader-night.png", "reading/05n-night-dict.png"]

# Single shots for the docs.
