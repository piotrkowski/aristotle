[workspace]
resolver = "2"
members = [
    "crates/aristotle-hal",
    "crates/aristotle-hello",
    "crates/aristotle-touch",
    "crates/aristotle-bench",
    "crates/aristotle-pen",
    "crates/aristotle-observe",
    "crates/aristotle-library",
    "crates/aristotle-ui",
    "crates/aristotle-app",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
