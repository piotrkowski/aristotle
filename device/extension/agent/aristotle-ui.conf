# Aristotle at boot, instead of the stock GUI. Installed with the agent and
# idle unless /var/local/aristotle/autostart exists (KUAL > Aristotle > Start
# Aristotle at boot: on). All the logic is in /var/local/aristotle/ui-boot.sh;
# without it the job does nothing and the stock GUI starts as usual.
#
# It waits for the stock GUI's job to start, then stops it the same way
# takeover.sh does, so the stock boot path is unchanged up to that point.
# Fallbacks to the stock GUI: /mnt/us/aristotle-disable, three launches in a
# row that did not stay up for two minutes, Aristotle quitting normally, or
# /var/local/aristotle failing the ownership check below.
description "aristotle-ui: Aristotle instead of the stock GUI"

start on started lab126_gui
stop on stopping lab126 or ota-update

# Aristotle saves its progress on SIGTERM.
kill timeout 15

pre-start script
  R=${AGENT_TEST_ROOT:-}
  S=$R/var/local/aristotle
  [ -f "$S/ui-boot.sh" ] || exit 1
  # Started by hand (aristotlectl app start), or at boot with autostart on.
  # Once per boot: the stock GUI restarting later must not bring us back.
  if [ ! -e "$S/ui-request" ]; then
    [ -e "$S/autostart" ] || exit 1
    [ "$(cat "$S/ui-booted" 2> /dev/null)" != "$(cat $R/proc/sys/kernel/random/boot_id)" ] || exit 1
  fi
  if [ -L "$S" ] || [ ! -d "$S" ]; then bad=link; else
    set -- $(stat -c '%u %a' "$S")
    [ "$1" = "${AGENT_TEST_OWNER:-0}" ] && [ $((0$2 & 077)) = 0 ] && bad= || bad="owner $1, mode $2"
  fi
  if [ -n "$bad" ]; then
    logger -t aristotle "ui: $S is not root's alone ($bad); leaving the stock GUI"
    echo "$(date '+%F %T') ui: $S is not root's alone ($bad); leaving the stock GUI" >> $R/mnt/us/aristotle-refused.log
    exit 1
  fi
end script

script
  R=${AGENT_TEST_ROOT:-}
  cd $R/var/local/aristotle
  set -- $(stat -c '%u %a' .)
  [ "$1" = "${AGENT_TEST_OWNER:-0}" ] && [ $((0$2 & 077)) = 0 ] || exit 1
  export ARISTOTLE_DIR=/proc/$$/cwd
  exec /bin/sh ./ui-boot.sh
end script
