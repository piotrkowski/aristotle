# Keep Amazon's OTA daemons from running: when otaupd or otav3 is about to
# start, bind-mount a stub that only sleeps over its binary, so the real one
# never runs and com.lab126.ota never appears. No stock file changes; the
# bind mounts last until the next reboot. Installed with the agent;
# uninstall.sh removes it. To update the firmware on purpose: remove the
# agent, reboot, update.
#
# As a handler of the "starting" events, this task runs to the end before
# upstart executes the daemon (device/README.md, "Amazon's updates").
description "aristotle-ota: keep Amazon's OTA daemons from running"

start on starting otaupd or starting otav3
task

script
  R=${AGENT_TEST_ROOT:-}
  S=$R/var/local/aristotle
  [ -f "$S/ota-stub" ] || exit 0
  [ -d "$S" ] && [ ! -L "$S" ] || exit 0
  cd "$S"
  set -- $(stat -c '%u %a' .)
  if [ "$1" != "${AGENT_TEST_OWNER:-0}" ] || [ $((0$2 & 077)) != 0 ]; then
    logger -t aristotle "ota: $S is not root's alone (owner $1, mode $2); OTA daemons not blocked"
    exit 0
  fi
  for b in otaupd otav3; do
    grep -q " $R/usr/bin/$b " $R/proc/mounts && continue
    # Read-only, so the stub cannot be changed through the daemon's path.
    mount --bind ./ota-stub $R/usr/bin/$b && mount -o remount,ro,bind $R/usr/bin/$b || true
    logger -t aristotle "ota: /usr/bin/$b replaced by the stub until reboot"
  done
end script
