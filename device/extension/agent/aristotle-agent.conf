# Aristotle agent: USB network, SSH and a watchdog on every boot.
# One of the three files Aristotle installs on the root filesystem (with
# aristotle-ui.conf and aristotle-ota.conf). Everything it runs lives in
# /var/local/aristotle; deleting boot.sh there disables it without touching
# the root filesystem again. See device/extension/agent/.
#
# /var/local/aristotle must belong to root and give nothing to group or
# others. The stock framework job hands the rest of /var/local to its own
# user's group on every start, so a directory any other user can enter or
# replace is refused: the job does not start (device/README.md, "Security").
description "aristotle-agent: USB network, SSH, watchdog"

start on started lab126
stop on stopping lab126

respawn
respawn limit 5 600

pre-start script
  # R stands in for / in the host-side test (device/tests/agent.sh).
  R=${AGENT_TEST_ROOT:-}
  S=$R/var/local/aristotle
  # Missing: do nothing (exit status false = not started).
  [ -f "$S/boot.sh" ] || exit 1
  if [ -L "$S" ] || [ ! -d "$S" ]; then bad=link; else
    set -- $(stat -c '%u %a' "$S")
    [ "$1" = "${AGENT_TEST_OWNER:-0}" ] && [ $((0$2 & 077)) = 0 ] && bad= || bad="owner $1, mode $2"
  fi
  if [ -n "$bad" ]; then
    logger -t aristotle "agent: $S is not root's alone ($bad); not starting"
    echo "$(date '+%F %T') agent: $S is not root's alone ($bad); not starting" >> $R/mnt/us/aristotle-refused.log
    exit 1
  fi
end script

script
  R=${AGENT_TEST_ROOT:-}
  # Enter the checked directory and run from it: the scripts reach their
  # files through /proc/PID/cwd, so a directory renamed or replaced later in
  # this boot cannot change what runs.
  cd $R/var/local/aristotle
  set -- $(stat -c '%u %a' .)
  [ "$1" = "${AGENT_TEST_OWNER:-0}" ] && [ $((0$2 & 077)) = 0 ] || exit 1
  export ARISTOTLE_DIR=/proc/$$/cwd
  exec /bin/sh ./boot.sh
end script
