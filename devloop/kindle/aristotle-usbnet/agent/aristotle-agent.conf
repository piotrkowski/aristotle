# Aristotle agent: USB network, SSH and a watchdog on every boot.
# The only file the agent installs on the root filesystem. Everything it runs
# lives in /var/local/aristotle; deleting boot.sh there disables it without
# touching the root filesystem again. See devloop/kindle/aristotle-usbnet/agent/.
description "aristotle-agent: USB network, SSH, watchdog"

start on started lab126
stop on stopping lab126

respawn
respawn limit 5 600

pre-start script
  # Missing or not executable: do nothing (exit status false = not started).
  [ -x /var/local/aristotle/boot.sh ]
end script

exec /bin/sh /var/local/aristotle/boot.sh
